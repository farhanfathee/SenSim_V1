<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SenSim - Neurodivergent Sensory Coping Game</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #12122a;
            color: #e8e8f0;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
        }
        h1 {
            font-size: 72px;
            font-weight: 900;
            color: #00d2d3;
            letter-spacing: 6px;
            text-shadow: 0 0 40px rgba(0, 210, 211, 0.4);
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 22px;
            color: #a0a0c0;
            margin-bottom: 50px;
        }
        .links {
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        a {
            display: block;
            padding: 30px 50px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            backdrop-filter: blur(8px);
            min-width: 280px;
        }
        a:hover {
            transform: translateY(-6px);
            border-color: rgba(78, 205, 196, 0.4);
            box-shadow: 0 8px 40px rgba(78, 205, 196, 0.2);
        }
        a .label {
            font-size: 28px;
            font-weight: 800;
            color: #4ecdc4;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        a .desc {
            font-size: 16px;
            color: #a0a0c0;
        }
        .instructions {
            margin-top: 50px;
            font-size: 16px;
            color: #707090;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SenSim</h1>
        <p class="subtitle">Neurodivergent Sensory Coping Game</p>
        <div class="links">
            <a href="tv.html">
                <div class="label">TV Display</div>
                <div class="desc">Chaos environment screen</div>
            </a>
            <a href="table.html">
                <div class="label">Table Projection</div>
                <div class="desc">Interactive coping tools</div>
            </a>
        </div>
        <div class="instructions">
            Open <strong>TV Display</strong> on your TV/monitor and <strong>Table Projection</strong> on the projector.<br>
            Both must be open in the same browser for sync to work.
        </div>
    </div>
</body>
</html>
